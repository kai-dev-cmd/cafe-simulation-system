<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Shop</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- CUSTOMER PANEL -->
    <div id="customerPanel" class="panel">
      <div class="panel-header">
        <span class="window-controls" aria-hidden="true">
          <span class="window-dot"></span>
          <span class="window-dot"></span>
          <span class="window-dot"></span>
        </span>
        <span class="window-title">Customers</span>
      </div>
      <div id="customerBody" class="panel-body"></div>
    </div>

    <!-- MAIN APP PANEL -->
    <div id="mainPanel" class="panel">
      <div class="panel-header">
        <span class="window-controls" aria-hidden="true">
          <span class="window-dot"></span>
          <span class="window-dot"></span>
          <span class="window-dot"></span>
        </span>
        <span class="window-title">Your Shop</span>
      </div>
      <div id="mainBody" class="panel-body"></div>
    </div>

    <!-- INFO PANEL (TOGGLEABLE) -->
    <div id="infoPanel" class="panel hidden">
      <div class="panel-header panel-header-split">
        <span class="window-controls" aria-hidden="true">
          <span class="window-dot"></span>
          <span class="window-dot"></span>
          <span class="window-dot"></span>
        </span>
        <span class="window-title">Info</span>
        <button data-action="close-info">X</button>
      </div>
      <div id="infoBody" class="panel-body"></div>
    </div>

    <!-- KITCHEN PANEL -->
    <div id="kitchenPanel" class="panel">
      <div class="panel-header">
        <span class="window-controls">
          <span class="window-dot"></span>
          <span class="window-dot"></span>
          <span class="window-dot"></span>
        </span>
        <span class="window-title">Kitchen</span>
      </div>
      <div id="kitchenBody" class="panel-body"></div>
    </div>

    <!-- BUILDER PANEL (DEV TOOLS) -->
    <div id="builderPanel" class="panel">
      <div class="panel-header">
        <span class="window-controls">
          <span class="window-dot"></span>
          <span class="window-dot"></span>
          <span class="window-dot"></span>
        </span>
        <span class="window-title">Builder</span>
      </div>

      <div id="builderBody" class="panel-body"></div>
    </div>

    <script src="simulationEngine.js"></script>
    <script src="script.js"></script>
  </body>
</html>
